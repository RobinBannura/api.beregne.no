<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Beregne.no - Chatkalkulator</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 40px; max-width: 600px; margin: auto; }
        input, button { padding: 10px; width: 100%; margin-top: 10px; }
        #response { margin-top: 20px; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h2>Hva vil du beregne?</h2>
    <input type="text" id="prompt" placeholder="Skriv inn spørsmålet ditt...">
    <button onclick="sendPrompt()">Beregne</button>

    <div id="response"></div>

    <script>
        async function sendPrompt() {
            const prompt = document.getElementById("prompt").value;
            const responseBox = document.getElementById("response");
            responseBox.innerText = "Beregner...";

            const response = await fetch("/chat", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ prompt })
            });

            const data = await response.json();
            responseBox.innerText = data.response || data.error;
        }
    </script>
</body>
</html>
