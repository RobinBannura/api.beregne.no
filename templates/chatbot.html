<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Beregne.no Chatbot</title>
    <style>
        body {
            font-family: 'Helvetica Neue', sans-serif;
            background-color: #f9fafb;
            margin: 0;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2rem;
            color: #111827;
            margin-bottom: 1rem;
        }

        p {
            color: #4b5563;
            font-size: 1rem;
            margin-bottom: 2rem;
            text-align: center;
            max-width: 600px;
        }

        #form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 600px;
            gap: 0.75rem;
        }

        input[type="text"] {
            padding: 0.75rem 1rem;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
        }

        button {
            padding: 0.75rem 1rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #response {
            margin-top: 2rem;
            padding: 1rem 1.5rem;
            background-color: #ffffff;
            border-radius: 8px;
            border: 1px solid #e5e7eb;
            color: #111827;
            max-width: 600px;
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <h1>Beregne.no Chatbot</h1>
    <p>Still et spørsmål, som for eksempel: <em>"Hvor mye koster et lån på 3 mill over 25 år med 5 % rente?"</em></p>
    <div id="form">
        <input type="text" id="prompt" placeholder="Skriv inn beregningen din her...">
        <button onclick="sendPrompt()">Send</button>
    </div>
    <div id="response"></div>

    <script>
        async function sendPrompt() {
            const prompt = document.getElementById('prompt').value;
            const responseDiv = document.getElementById('response');
            responseDiv.textContent = "⏳ Tenker...";
            try {
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt })
                });
                const data = await res.json();
                responseDiv.innerHTML = `<strong>Svar:</strong><br>${data.response}`;
            } catch (error) {
                responseDiv.textContent = "Det oppstod en feil. Prøv igjen.";
            }
        }
    </script>
</body>
</html>
